#                                               "context": "Jenkins"
#                                           }
    - name: sh
      shell: bash
      run: |-
        git config --global user.email "labs.robot@gmail.com"
        git config --global user.name "Labs Robot"
        git checkout master
        git fetch origin ${{ env.PR_BRANCH }}:pr
        git merge pr --ff
  Spin_up_shared_ansible_slave_Apply_ci_for_ci_Inventory:
    name: Spin up shared ansible slave-Apply ci-for-ci Inventory
    runs-on:
      - self-hosted
      - master
    needs: Spin_up_shared_ansible_slave_Merge_PR
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: echo Applying inventory
    - name: sh
      shell: bash
      run: ansible-galaxy install -r requirements.yml --roles-path=roles
    - name: sh
      shell: bash
      run: '"ansible-playbook site.yml -e ci_cd_namespace=${{ env.PR_CI_CD_PROJECT_NAME }} -e dev_namespace=${{ env.PR_DEV_PROJECT_NAME }} -e test_namespace=${{ env.PR_TEST_PROJECT_NAME }} -e role=admin"'
    - name: snapshot post build job status
      run: |-
        echo "success=${{ job.status == 'success' }}" >> $GITHUB_OUTPUT
        echo "failure=${{ job.status == 'failure' }}" >> $GITHUB_OUTPUT
      id: post_build
