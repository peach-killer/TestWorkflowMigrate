  Post-Build:
    if: always()
    name: Post Build
    runs-on:
      - self-hosted
      - master
    needs:
    - Prepare_Environment
    - Clear_Existing_Projects
    - Spin_up_shared_ansible_slave_Merge_PR
    - Spin_up_shared_ansible_slave_Apply_ci_for_ci_Inventory
    - Verifying_CI_Builds
    - Verifying_CI_Deploys
    - Clear_Existing_Projects_on_Successful_Job
    steps:
    - name: snapshot post build workflow status
      run: |-
        echo "success=${{ contains(needs.*.result,'success') && !contains(needs.*.result,'cancelled') && !contains(needs.*.result,'failure') }}" >> $GITHUB_OUTPUT
        echo "failure=${{ contains(needs.*.result,'failure') && !contains(needs.*.result,'cancelled') }}" >> $GITHUB_OUTPUT
      id: post_build
