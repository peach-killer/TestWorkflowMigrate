name: jenkins110
on:
  workflow_dispatch:
jobs:
  Install:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: bundle install
  Build:
    runs-on: ubuntu-latest
    needs: Install
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: bundle exec rake build
    - name: snapshot post build job status
      run: echo "success=${{ job.status == 'success' }}" >> $GITHUB_OUTPUT
      id: post_build
#     # This item has no matching transformer
#     - archive:
#       - key: includes
#         value:
#           isLiteral: true
#           value: pkg/*.gem
#       if: steps.post_build.outputs.success == 'true'
  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: bundle exec rake spec
    - name: snapshot post build job status
      run: echo "success=${{ job.status == 'success' }}" >> $GITHUB_OUTPUT
      id: post_build
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4.1.0
      with:
        name: RCov Report
        path: coverage
      if: steps.post_build.outputs.success == 'true'
  Post-Build:
    if: always()
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - Install
    - Build
    - Test
    steps:
    - name: echo message
      run: 'echo "Send notifications for result: ${currentBuild.result}"'
      if: always()
