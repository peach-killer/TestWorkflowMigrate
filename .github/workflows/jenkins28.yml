#       arguments:
#       - key: scriptBlock
#         value:
#           isLiteral: true
#           value: govuk.initialize()
  Run_tests:
    name: Run tests
    runs-on: ubuntu-latest
    needs: Setup_Environment
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: GOVUK_DOCKER_DIR=. make test
