name: test-verify
on:
  schedule:
  - cron: 24 4 * * 1-5
  - cron: 12 4 * * 1-5
  workflow_dispatch:
    inputs:
      BRANCH:
        required: false
        description: Git branch to build
        default: main
      Choice:
        required: true
        description: 'Deployment environment (Valid options: dev, staging, production)'
env:
  APP_ENV: production
  DEPLOY_SERVER: deploy.example.com
jobs:
  Checkout:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: echo Checkout
  Build:
    runs-on: ubuntu-latest
    needs: Checkout
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: mvn clean install
  Test:
    runs-on: ubuntu-latest
    needs: Build
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: sh
      shell: bash
      run: mvn test
    - name: echo message
      run: 'echo always '
      if: always()
  Post-Build:
    if: always()
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - Checkout
    - Build
    - Test
    steps:
    - name: snapshot post build workflow status
      run: |-
        echo "success=${{ contains(needs.*.result,'success') && !contains(needs.*.result,'cancelled') && !contains(needs.*.result,'failure') }}" >> $GITHUB_OUTPUT
        echo "failure=${{ contains(needs.*.result,'failure') && !contains(needs.*.result,'cancelled') }}" >> $GITHUB_OUTPUT
      id: post_build
    - name: echo message
      run: echo failure !
      if: steps.post_build.outputs.failure == 'true'
    - name: echo message
      run: echo success!
      if: steps.post_build.outputs.success == 'true'
