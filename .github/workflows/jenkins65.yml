  Archive:
    runs-on: ubuntu-latest
    needs: Build_and_Push_Docker_Image
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4.1.0
      if: always()
      with:
        if-no-files-found: ignore
        path: "**/build/libs/*.jar"
  Post-Build:
    if: always()
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - Checkout
    - Build
    - Build_and_Push_Docker_Image
    - Archive
