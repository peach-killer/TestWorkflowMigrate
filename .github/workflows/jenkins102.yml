name: jenkins102
on:
  workflow_dispatch:
jobs:
  Example:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4.1.0
    - name: echo message
      run: echo Hello World
  Post-Build:
    if: always()
    name: Post Build
    runs-on: ubuntu-latest
    needs:
    - Example
    steps:
    - name: echo message
      run: echo I will always say Hello again!
      if: always()
